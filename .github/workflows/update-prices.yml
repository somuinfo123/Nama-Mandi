name: Update mandi prices

on:
  schedule:
    - cron: "37 13 * * *"   # every day at 7:07 pm India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new prices from data.gov.in
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          TIME_LIMIT_MIN: "300"
        run: python scripts/update_prices.py

      - name: Save updated data
        run: |
          git config user.name "mandi-rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No new prices today."
          else
            git commit -m "Prices updated $(date -u +%Y-%m-%d)"
            git push
          fi
