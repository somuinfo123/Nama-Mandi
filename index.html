<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d5f3a">
<title>Mandi Rates · ಮಂಡಿ ದರ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ====== Theme ====== */
:root{
  color-scheme:light;
  --bg:#f3f2ec; --surface:#fcfcfb; --surface-2:#eeede6; --border:#dcdad1;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7873;
  --brand:#1d5f3a; --brand-ink:#ffffff; --brand-soft:#e3efe6;
  --series-1:#2a78d6; --series-1-soft:rgba(42,120,214,.16); --series-1-light:#a9c8ee;
  --good:#0a7a2f; --good-bg:#e4f3e8; --warn:#9a5b00; --warn-bg:#fbefd9; --bad:#b3261e; --bad-bg:#fbe5e3;
  --grid:#e6e4dc;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#363633;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8d86;
    --brand:#2f8a57; --brand-ink:#ffffff; --brand-soft:#1d3326;
    --series-1:#3987e5; --series-1-soft:rgba(57,135,229,.22); --series-1-light:#2c4d75;
    --good:#5cc97b; --good-bg:#1b3022; --warn:#f0b54a; --warn-bg:#352a14; --bad:#f08a80; --bad-bg:#3a1e1b;
    --grid:#2c2c2a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Noto Sans Kannada","Noto Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}

header.top{background:var(--brand);color:var(--brand-ink);padding:14px 0 16px}
header.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
header h1{font-size:1.25rem;margin:0;line-height:1.2}
header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
.lang{margin-left:auto;display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:#fff;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--brand);font-weight:700}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:.9rem}
.banner.demo{background:var(--warn-bg);color:var(--warn);font-weight:600}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--surface-2);color:var(--text-2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:.8rem;margin-right:8px;vertical-align:1px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip small{color:var(--muted);font-size:.72rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.linkbtn{background:none;border:0;color:var(--series-1);padding:8px 0;cursor:pointer;text-decoration:underline;font-size:.9rem}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 16px;min-height:48px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.55;cursor:default}
select{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:48px;max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.field label{font-size:.82rem;color:var(--text-2)}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc .box{background:var(--surface-2);border-radius:10px;padding:12px}
.fc .k{font-size:.78rem;color:var(--text-2)}
.fc .v{font-size:1.15rem;font-weight:700;font-family:"Noto Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.predict{margin-top:14px;padding:14px;border-radius:12px;background:var(--brand-soft)}
.predict .big{color:var(--text)}
.legend i.dash{background:none;border-top:2px dashed var(--series-1);height:0;vertical-align:3px}
input[type=date],input[type=number]{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
input[type=text],input[type=password]{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}

.status{color:var(--text-2);font-size:.9rem;margin-top:10px;display:flex;gap:8px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* hero */
.hero .where{color:var(--text-2);font-size:.9rem;margin-bottom:6px}
.hero .where b{color:var(--text)}
.big{font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;font-family:"Noto Sans",system-ui,sans-serif}
.big small{font-size:.95rem;font-weight:400;color:var(--text-2);font-family:"Noto Sans Kannada","Noto Sans",sans-serif}
.sub{color:var(--text-2);font-size:.92rem;margin-top:4px}
.verdict{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:10px;font-weight:600}
.verdict.high{background:var(--good-bg);color:var(--good)}
.verdict.mid{background:var(--surface-2);color:var(--text)}
.verdict.low{background:var(--bad-bg);color:var(--bad)}
.verdict svg{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat .k{font-size:.75rem;color:var(--text-2);line-height:1.25}
.stat .v{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;font-family:"Noto Sans",system-ui,sans-serif;margin-top:2px}
.stat .d{font-size:.75rem;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)}

.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:40px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface);font-weight:700}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chartbox{position:relative;height:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--series-1);vertical-align:3px;margin-right:6px}
.legend i.band{height:10px;background:var(--series-1-soft);vertical-align:-1px}
.legend i.best{height:10px;background:var(--series-1);vertical-align:-1px}
.legend i.other{height:10px;background:var(--series-1-light);vertical-align:-1px}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.insight{font-weight:600;margin:0 0 10px}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:.75rem;color:var(--text-2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Noto Sans",system-ui,sans-serif}
td.nowrap{white-space:nowrap}
tr.sel td{font-weight:700}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.tag{font-size:.7rem;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
@media (prefers-color-scheme: dark){.tag{color:#8fd3a8}}
details summary{cursor:pointer;color:var(--series-1);font-size:.88rem;margin-top:10px}
footer{color:var(--muted);font-size:.8rem;margin-top:22px;text-align:center}
footer a{color:var(--muted)}
.hidden{display:none!important}

/* chosen crop + mandi bar */
.summary .sumtxt{font-size:1.05rem}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}

/* one-question-at-a-time panels */
.askhint{color:var(--text-2);font-size:.95rem;margin:20px 2px 0}
.card.q{padding:0;overflow:hidden;margin-top:10px}
.qhead{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 16px;min-height:64px;text-align:left;cursor:pointer;font-weight:600;font-size:1rem;line-height:1.3}
.qhead .qi{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--good);display:grid;place-items:center;flex:none}
.qhead .chev{margin-left:auto;flex:none;color:var(--text-2);transition:transform .2s}
.q.open .qhead .chev{transform:rotate(180deg)}
.q.open .qhead{border-bottom:1px solid var(--border)}
.qbody{padding:16px}
.q:not(.open) .qbody{display:none}
@media (max-width:420px){.big{font-size:2rem}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M12 13c-3 0-5-2-5-5 3 0 5 2 5 5z"/><path d="M12 10c0-3 2-5 5-5 0 3-2 5-5 5z"/><path d="M12 17c-3 0-5-2-5-4 3 0 5 1.5 5 4z"/><path d="M12 15c0-2.5 2-4 5-4 0 2-2 4-5 4z"/></svg>
    </div>
    <div>
      <h1 data-t="title"></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="kn">ಕನ್ನಡ</button><button data-lang="en">English</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="demoBanner" class="banner demo hidden" data-t="demo"></div>
  <div id="errBanner" class="banner err hidden"></div>

  <!-- Step 1: crop -->
  <section id="cropCard" class="card">
    <h2><span class="step">1</span><span data-t="chooseCrop"></span></h2>
    <div class="chips" id="cropChips"></div>
    <button class="linkbtn" id="moreCrops" data-t="moreCrops"></button>
    <div id="moreWrap" class="hidden" style="margin-top:6px">
      <select id="moreSel" aria-label="All crops"></select>
    </div>
  </section>

  <!-- Step 2: mandi -->
  <section id="mandiCard" class="card hidden">
    <h2><span class="step">2</span><span data-t="chooseMandi"></span></h2>
    <div class="row">
      <button class="btn" id="locBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>
        <span data-t="useLoc"></span>
      </button>
      <span class="sub" data-t="or"></span>
      <select id="mandiSel" aria-label="Mandi"></select>
    </div>
    <div id="mandiStatus" class="status hidden"></div>
  </section>

  <!-- Chosen crop + mandi (shown once both are picked) -->
  <section id="summary" class="card summary hidden">
    <div class="sumtxt"><b id="sumCrop"></b> · <span id="sumMandi"></span></div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn secondary sm" id="chgCrop" data-t="chgCrop"></button>
      <button class="btn secondary sm" id="chgMandi" data-t="chgMandi"></button>
    </div>
  </section>

  <!-- Results -->
  <div id="results" class="hidden">
    <section class="card hero" id="heroCard"></section>

    <p class="askhint" data-t="askHint"></p>

    <section class="card q" id="qHist">
      <button class="qhead" aria-expanded="false" aria-controls="qHistBody">
        <span class="qi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
        <span data-t="qHist"></span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="qbody" id="qHistBody">
        <div class="stats" id="histStats" style="margin-top:0;margin-bottom:14px"></div>
        <div class="charthead">
          <div class="row" id="varietyRow">
            <label for="varSel" class="sub" data-t="variety"></label>
            <select id="varSel"></select>
          </div>
          <div class="seg" id="rangeSeg" role="group">
            <button data-r="6M">6M</button><button data-r="1Y">1Y</button><button data-r="3Y">3Y</button><button data-r="ALL" data-t="all"></button>
          </div>
        </div>
        <div class="chartbox"><canvas id="histChart" role="img"></canvas></div>
        <div class="legend"><span><i></i><span data-t="modal"></span></span><span><i class="band"></i><span data-t="minmax"></span></span></div>
        <p class="note" data-t="modalNote"></p>
      </div>
    </section>

    <section class="card q" id="qSeason">
      <button class="qhead" aria-expanded="false" aria-controls="qSeasonBody">
        <span class="qi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <span data-t="season"></span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="qbody" id="qSeasonBody">
        <p class="insight" id="seasonInsight"></p>
        <div class="chartbox" style="height:230px"><canvas id="seasonChart" role="img"></canvas></div>
        <div class="legend"><span><i class="best"></i><span data-t="bestMonths"></span></span><span><i class="other"></i><span data-t="otherMonths"></span></span></div>
        <p class="note" data-t="seasonNote"></p>
        <details><summary data-t="seeNumbers"></summary><div id="seasonTable"></div></details>
      </div>
    </section>

    <section class="card q" id="qNearby">
      <button class="qhead" aria-expanded="false" aria-controls="qNearbyBody">
        <span class="qi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg></span>
        <span data-t="qNearby"></span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="qbody" id="qNearbyBody">
        <p class="note" style="margin-top:0" data-t="nearbyNote"></p>
        <div id="nearbyTable"></div>
      </div>
    </section>

    <section class="card q" id="qPlan">
      <button class="qhead" aria-expanded="false" aria-controls="qPlanBody">
        <span class="qi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c-4 0-6-2-6-6 4 0 6 2 6 6z"/><path d="M12 13c0-4 2-6 6-6 0 4-2 6-6 6z"/></svg></span>
        <span data-t="qPlan"></span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="qbody" id="qPlanBody">
        <div class="row">
          <div class="field" style="min-width:160px"><label for="sowIn" data-t="sowDate"></label><input id="sowIn" type="date"></div>
          <div class="field" style="min-width:140px;max-width:200px"><label for="durIn" data-t="duration"></label><input id="durIn" type="number" min="30" max="400" step="5" inputmode="numeric"></div>
        </div>
        <div id="planOut"></div>
      </div>
    </section>
  </div>

  <footer>
    <div data-t="source"></div>
    <div id="updated" style="margin-top:6px"></div>
  </footer>
</main>

<script>

  DATA_URL: "data/",          // folder the daily GitHub Action writes to

/* ====== Data access ======
   Prices come from small JSON files in data/ that the daily GitHub Action
   (scripts/update_prices.py) refreshes from AGMARKNET / data.gov.in. */
function parseDate(s){
  if(!s) return null; s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return Date.UTC(+m[1],m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return Date.UTC(+m[3],m[2]-1,+m[1]);
  return null;
}
const ver=()=>new Date().toISOString().slice(0,10);   // refresh files once a day
async function getJSON(path){
  let res;
  try{ res=await fetch(CONFIG.DATA_URL+path+"?v="+ver()); }catch(e){ throw new Error("errNet"); }
  if(res.status===404) throw new Error("errNoData");
  if(!res.ok) throw new Error("errNet");
  return res.json();
}
let META=null;
async function loadMeta(){
  if(META) return META;
  META = S.demo ? DEMO.meta() : await getJSON("meta.json");
  if(!META.crops||!META.crops.length) throw new Error("errNoData");
  if(META.updated) $("#updated").textContent=t("updatedOn")+" "+fmtDate(Date.parse(META.updated));
  return META;
}
async function loadSeries(file){
  const d = S.demo ? DEMO.series(file) : await getJSON(file);
  return d.rows.map(r=>({date:parseDate(r[0]),variety:r[1],min:r[2],max:r[3],modal:r[4]})).filter(r=>r.date&&r.modal>0);
}

/* ====== Geo ====== */
const nm = s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function locate(market,district){
  const tryName=(name)=>{
    const m=nm(name); if(!m) return null;
    const first=nm(String(name).split(/[\s(,\-\/]/)[0]);
    let best=null,score=0;
    for(const [al,lat,lon] of TOWNS) for(const a0 of al){
      const a=nm(a0); let sc=0;
      if(a.length>=3 && m.includes(a)) sc=a.length+10;
      else if(first.length>=5 && a.length>=5 && first.slice(0,5)===a.slice(0,5)) sc=5;
      if(sc>score){score=sc;best={lat,lon}}
    }
    return best;
  };
  return tryName(market)||tryName(district);
}
function km(a,b){
  const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ====== Stats helpers ====== */
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function dailySeries(recs){
  const by=new Map();
  for(const r of recs){ if(!by.has(r.date)) by.set(r.date,[]); by.get(r.date).push(r); }
  return [...by.entries()].sort((a,b)=>a[0]-b[0]).map(([d,rs])=>({
    date:d, modal:median(rs.map(r=>r.modal)),
    min:Math.min(...rs.map(r=>r.min||r.modal)), max:Math.max(...rs.map(r=>r.max||r.modal))
  }));
}
function latestByMarket(recs){
  const by=new Map();
  for(const r of recs){
    const k=r.market; const cur=by.get(k);
    if(!cur) by.set(k,{market:r.market,district:r.district,date:r.date,vals:[r.modal],count:1});
    else{ cur.count++; if(r.date>cur.date){cur.date=r.date;cur.vals=[r.modal]} else if(r.date===cur.date) cur.vals.push(r.modal); }
  }
  return [...by.values()].map(m=>({...m,modal:median(m.vals),geo:locate(m.market,m.district)}));
}

function findCrop(meta,c){
  return meta.crops.find(x=>c.names.includes(x.commodity)) ||
         meta.crops.find(x=>c.kw.some(k=>x.commodity.toLowerCase().includes(k))) || null;
}

async function selectCrop(c){
  S.crop=c; S.market=null; S.recs=[]; showErr(null); $("#durIn").value=DUR[c.en]||"";

  $("#mandiSel").disabled=true; $("#locBtn").disabled=true;

    const meta=await loadMeta();
    const mc=findCrop(meta,c);
    if(!mc){ status(st,t("noCrop"),false); return; }
    S.commodity=mc.commodity;
    S.markets=mc.markets.map(m=>({market:m.market,district:m.district,file:m.file,date:parseDate(m.last),modal:m.modal,count:m.rows,geo:locate(m.market,m.district)}))
      .sort((a,b)=>a.market.localeCompare(b.market));
    st.classList.add("hidden");
    renderMandiSelect();
    $("#mandiSel").disabled=false; $("#locBtn").disabled=false;
    $("#mandiCard").scrollIntoView({behavior:"smooth",block:"start"});
    if(S.user) pickNearest();
    else { const last=LS.get("market",null); if(last && S.markets.some(m=>m.market===last)) selectMarket(last); }
  }catch(e){ st.classList.add("hidden"); showErr(e.message); }
}

function renderMandiSelect(){
  const sel=$("#mandiSel"); if(!S.markets.length){sel.innerHTML=`<option>${esc(t("pickMandi"))}</option>`;return}
  sel.innerHTML=`<option value="">${esc(t("pickMandi"))}</option>`+S.markets.map(m=>{
    const d=S.user&&m.geo?` · ${Math.round(km(S.user,m.geo))} ${t("km")}`:"";
    return `<option value="${esc(m.market)}" ${S.market===m.market?"selected":""}>${esc(m.market)} (${esc(m.district)})${d}</option>`;
  }).join("");
}
$("#mandiSel").onchange=e=>{ if(e.target.value) selectMarket(e.target.value); };
$("#locBtn").onclick=()=>{
  const st=$("#mandiStatus");
  if(!navigator.geolocation){status(st,t("locDenied"),false);return}
  status(st,t("locating"));
  navigator.geolocation.getCurrentPosition(p=>{
    S.user={lat:p.coords.latitude,lon:p.coords.longitude}; LS.set("user",S.user);
    renderMandiSelect(); pickNearest();
  },()=>status(st,t("locDenied"),false),{enableHighAccuracy:false,timeout:15000,maximumAge:3600e3});
};
function pickNearest(){
  const newest=Math.max(...S.markets.map(m=>m.date));
  const cand=S.markets.filter(m=>m.geo);
  const active=cand.filter(m=>newest-m.date<120*DAY);
  const pool=(active.length?active:cand).map(m=>({m,d:km(S.user,m.geo)})).sort((a,b)=>a.d-b.d);
  if(!pool.length){status($("#mandiStatus"),t("locDenied"),false);return}
  status($("#mandiStatus"),t("nearestIs",{m:pool[0].m.market,d:Math.round(pool[0].d)}),false);
  selectMarket(pool[0].m.market);
}

async function selectMarket(name){
  S.market=name; LS.set("market",name); S.variety="ALL"; renderMandiSelect(); showErr(null);
  const st=$("#mandiStatus"); const prev=st.textContent;
  status(st,t("loadingHist"));
  try{
    const mk=S.markets.find(m=>m.market===name);
    S.recs=await loadSeries(mk.file);
    if(prev && !/%|…/.test(prev)) status(st,prev,false); else st.classList.add("hidden");
    if(!S.recs.length){status(st,t("noData"),false);return}
    st.classList.add("hidden");
    $("#cropCard").classList.add("hidden"); $("#mandiCard").classList.add("hidden");
    $("#summary").classList.remove("hidden"); $("#results").classList.remove("hidden");
    renderResults();
    window.scrollTo({top:0,behavior:"smooth"});

}

function filteredRecs(){return S.variety==="ALL"?S.recs:S.recs.filter(r=>r.variety===S.variety)}
const fmtDate=(d,short)=>{const x=new Date(d);const M=(short?MONTHS_S:MONTHS)[S.lang][x.getUTCMonth()];return short?`${x.getUTCDate()} ${M} ${String(x.getUTCFullYear()).slice(2)}`:`${x.getUTCDate()} ${M} ${x.getUTCFullYear()}`};
const numDate=d=>{const x=new Date(d);return `${String(x.getUTCDate()).padStart(2,"0")}/${String(x.getUTCMonth()+1).padStart(2,"0")}/${String(x.getUTCFullYear()).slice(2)}`};

function renderHero(ser){
  const last=ser[ser.length-1];
  const yr=ser.filter(p=>p.date>last.date-365*DAY);
  const d30=ser.filter(p=>p.date>last.date-30*DAY);
  const ly=new Date(last.date); const lyM=ly.getUTCMonth(), lyY=ly.getUTCFullYear()-1;
  const lastYr=ser.filter(p=>{const x=new Date(p.date);return x.getUTCMonth()===lyM&&x.getUTCFullYear()===lyY});
  const avg30=mean(d30.map(p=>p.modal)), avg12=mean(yr.map(p=>p.modal)), avgLy=lastYr.length?mean(lastYr.map(p=>p.modal)):null;
  const pct=Math.round(100*yr.filter(p=>p.modal<last.modal).length/Math.max(1,yr.length));
  const level=pct>=67?"high":pct<=33?"low":"mid";
  const ago=Math.floor((Date.now()-last.date)/DAY);
  const crop=S.crop?cropLabel(S.crop):S.commodity;
  const diff=(v)=>{if(v==null)return"";const p=(last.modal-v)/v*100;const up=p>=0;return `<div class="d ${up?"up":"down"}">${up?"▲":"▼"} ${esc(t(up?"cmpUp":"cmpDown",{p:Math.abs(p).toFixed(0)}))}</div>`};
  const icon={high:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    low:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
    mid:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>'}[level];
  $("#heroCard").innerHTML=`
    <div class="where">${esc(crop)} · ${esc(t("latest"))} <b>${esc(S.market)}</b>${S.variety!=="ALL"?" · "+esc(S.variety):""}</div>
    <div class="big">${inr(last.modal)} <small>${esc(t("perQ"))}</small></div>
    <div class="sub">≈ ${inr(last.modal/100)} ${esc(t("perKg"))} · ${esc(t("range"))}: ${inr(last.min)} – ${inr(last.max)} · ${esc(t("reported"))}: ${esc(fmtDate(last.date))}</div>
    ${ago>21?`<div class="banner info">${esc(t("stale",{n:ago}))}</div>`:""}
    <div class="verdict ${level}">${icon}<span>${esc(t("vs12"))}: ${esc(t(level))}</span></div>
    <div class="sub" style="margin-top:4px">${esc(t("pctl",{p:pct}))}</div>`;
  $("#histStats").innerHTML=`
      <div class="stat"><div class="k">${esc(t("avg30"))}</div><div class="v">${inr(avg30)}</div>${diff(avg30)}</div>
      <div class="stat"><div class="k">${esc(t("avg12"))}</div><div class="v">${inr(avg12)}</div>${diff(avg12)}</div>
      <div class="stat"><div class="k">${esc(t("lastYr"))}</div><div class="v">${inr(avgLy)}</div>${diff(avgLy)}</div>`;
}

function weekly(ser){
  const by=new Map();
  for(const p of ser){const w=Math.floor((p.date/DAY+3)/7);if(!by.has(w))by.set(w,[]);by.get(w).push(p)}
  return [...by.values()].map(ps=>({date:ps[ps.length-1].date,modal:mean(ps.map(p=>p.modal)),min:mean(ps.map(p=>p.min)),max:mean(ps.map(p=>p.max))}));
}

  let pts=ser.filter(p=>p.date>last-span*DAY);
  if(span>366) pts=weekly(pts);
  const labels=pts.map(p=>fmtDate(p.date,true));
  const c1=css("--series-1"), band=css("--series-1-soft"), grid=css("--grid"), ink=css("--text-2");
  S.charts.h&&S.charts.h.destroy();

function seasonal(ser){
  const ym=new Map();
  for(const p of ser){const d=new Date(p.date);const k=d.getUTCFullYear()*12+d.getUTCMonth();if(!ym.has(k))ym.set(k,[]);ym.get(k).push(p.modal)}
  const byYear=new Map();
  for(const [k,v] of ym){const y=Math.floor(k/12),m=k%12;if(!byYear.has(y))byYear.set(y,{});byYear.get(y)[m]=mean(v)}
  const idx=Array.from({length:12},()=>[]); let years=0;
  for(const [y,ms] of byYear){
    const vals=Object.values(ms); if(vals.length<6) continue; years++;
    const a=mean(vals); for(const m in ms) idx[m].push(ms[m]/a);
  }
  const lastD=ser[ser.length-1].date;
  const level=mean(ser.filter(p=>p.date>lastD-365*DAY).map(p=>p.modal));
  const months=idx.map((a,m)=>({m,i:a.length?mean(a):null,n:a.length}));
  const have=months.filter(x=>x.i!=null);
  return {years,months,level,ok:years>=1&&have.length>=8};
}
function renderSeason(ser){
  const s=seasonal(ser), M=MONTHS[S.lang];
  S.charts.s&&S.charts.s.destroy();
  if(!s.ok){ $("#seasonInsight").textContent=t("seasonFew"); $("#seasonTable").innerHTML=""; return; }
  const have=s.months.filter(x=>x.i!=null).sort((a,b)=>b.i-a.i);
  const best=new Set(have.slice(0,2).map(x=>x.m)), low=have[have.length-1];
  const gap=Math.round((have[0].i-low.i)/low.i*100);
  $("#seasonInsight").textContent=t("seasonIns",{a:have.slice(0,2).map(x=>M[x.m]).join(S.lang==="kn"?" ಮತ್ತು ":" & "),b:M[low.m],g:gap})+" "+t("yearsUsed",{n:s.years});
  const c1=css("--series-1"), c2=css("--series-1-light"), grid=css("--grid"), ink=css("--text-2");
  const data=s.months.map(x=>x.i==null?null:x.i*s.level);
  S.charts.s=new Chart($("#seasonChart"),{
    type:"bar",
    data:{labels:MONTHS_S[S.lang],datasets:[{data,backgroundColor:s.months.map(x=>best.has(x.m)?c1:c2),borderRadius:{topLeft:4,topRight:4},borderSkipped:"bottom",categoryPercentage:.85,barPercentage:.85}]},
    options:{maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:i=>M[i[0].dataIndex],label:i=>{const x=s.months[i.dataIndex];return [`${t("typical")}: ${inr(i.raw)}`,`${t("vsAvg")}: ${x.i>=1?"+":""}${((x.i-1)*100).toFixed(0)}%`]}}}},
      scales:{x:{grid:{display:false},ticks:{color:ink,autoSkip:false,maxRotation:60,font:{size:10}}},
              y:{grid:{color:grid},border:{display:false},beginAtZero:false,ticks:{color:ink,maxTicksLimit:4,callback:v=>"₹"+Number(v).toLocaleString("en-IN")}}}}
  });
  $("#seasonChart").setAttribute("aria-label",$("#seasonInsight").textContent);
  $("#seasonTable").innerHTML=`<table><thead><tr><th>${esc(t("month"))}</th><th class="num">${esc(t("typical"))}</th><th class="num">${esc(t("vsAvg"))}</th></tr></thead><tbody>${
    s.months.map(x=>`<tr class="${best.has(x.m)?"sel":""}"><td>${esc(M[x.m])}</td><td class="num">${x.i==null?"—":inr(x.i*s.level)}</td><td class="num">${x.i==null?"—":(x.i>=1?"+":"")+((x.i-1)*100).toFixed(0)+"%"}</td></tr>`).join("")}</tbody></table>`;
}

/* ====== Harvest-price prediction ======
   Method: monthly averages → seasonal index per calendar month (each year's months divided by that year's mean)
   → de-seasonalised log trend over the last 36 months (slope damped by half, capped at ±2%/month)
   → anchor on the last 3 months → project to the target month × that month's seasonal index.
   Accuracy is measured by re-running the same method on past cut-off points (walk-forward backtest). */
function monthlyMap(ser){
  const ym=new Map();
  for(const p of ser){const d=new Date(p.date);const k=d.getUTCFullYear()*12+d.getUTCMonth();if(!ym.has(k))ym.set(k,[]);ym.get(k).push(p.modal)}
  const out=new Map(); [...ym.keys()].sort((a,b)=>a-b).forEach(k=>out.set(k,mean(ym.get(k)))); return out;
}
function seasonIdx(mm){
  const byYear=new Map();
  for(const [k,v] of mm){const y=Math.floor(k/12);if(!byYear.has(y))byYear.set(y,{});byYear.get(y)[k%12]=v}
  const acc=Array.from({length:12},()=>[]);
  for(const ms of byYear.values()){const vals=Object.values(ms);if(vals.length<6)continue;const a=mean(vals);for(const m in ms)acc[m].push(ms[m]/a)}
  return acc.map(a=>a.length?mean(a):null);
}
function fcast(mm,target){
  const keys=[...mm.keys()]; const k0=keys[keys.length-1];
  const idx=seasonIdx(mm); const I=k=>idx[((k%12)+12)%12]??1;
  const xs=[],ys=[]; keys.filter(k=>k>k0-36).forEach(k=>{xs.push(k);ys.push(Math.log(mm.get(k)/I(k)))});
  let b=0;
  if(xs.length>=6){const mx=mean(xs),my=mean(ys);let n=0,d=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);d+=(x-mx)**2});b=d?n/d:0}
  b=Math.max(-0.02,Math.min(0.02,b*0.5));
  const aK=mean(xs.slice(-3)), aY=mean(ys.slice(-3));
  return Math.exp(aY+b*(target-aK))*I(target);
}
function backtest(mm,h){
  const keys=[...mm.keys()]; const errs=[];
  for(let i=0;i<keys.length;i++){
    const c=keys[i]; if(i<18) continue; if(!mm.has(c+h)) continue;
    const sub=new Map(keys.slice(0,i+1).map(k=>[k,mm.get(k)]));
    errs.push(Math.abs(fcast(sub,c+h)/mm.get(c+h)-1));
  }
  errs.sort((a,b)=>a-b);
  const q=p=>errs[Math.min(errs.length-1,Math.floor(p*errs.length))];
  return errs.length>=6?{n:errs.length,p50:q(.5),p80:q(.8)}:null;
}
const kDate=k=>Date.UTC(Math.floor(k/12),k%12,15);
const kName=k=>`${MONTHS[S.lang][k%12]} ${Math.floor(k/12)}`;

function renderPlan(ser){
  const out=$("#planOut"), sow=$("#sowIn"), dur=$("#durIn");
  if(!dur.value) dur.value=(S.crop&&DUR[S.crop.en])||110;
  sow.onchange=dur.onchange=dur.oninput=()=>renderPlan(dailySeries(filteredRecs()));
  S.charts.p&&S.charts.p.destroy(); S.charts.p=null;
  if(S.crop && DUR[S.crop.en]===0){ out.innerHTML=`<p class="sub">${esc(t("perennial"))}</p>`; return; }
  if(!sow.value){ out.innerHTML=`<p class="note">${esc(t("planPrompt"))}</p>`; return; }
  const mm=monthlyMap(ser); const keys=[...mm.keys()];
  if(keys.length<18){ out.innerHTML=`<p class="banner info">${esc(t("planFew"))}</p>`; return; }
  const sowD=Date.parse(sow.value)||Date.now(), days=Math.max(30,Math.min(400,+dur.value||110));
  const hv=new Date(sowD+days*DAY); const hk=hv.getUTCFullYear()*12+hv.getUTCMonth();
  const k0=keys[keys.length-1]; const h=Math.max(1,hk-k0);
  const bt=backtest(mm,Math.min(h,12));
  const e=bt?bt.p80:0.25;
  const pred=fcast(mm,hk), lo=pred*(1-e), hi=pred*(1+e);
  const today=ser[ser.length-1].modal, chg=(pred/today-1)*100;
  const hold=[1,2].map(j=>({k:hk+j,v:fcast(mm,hk+j)}));
  const past=keys.filter(k=>k%12===hk%12).slice(-4);
  out.innerHTML=`
    <div class="fc">
      <div class="box"><div class="k">${esc(t("harvestOn"))}</div><div class="v">${esc(fmtDate(hv.getTime()))}</div></div>
      <div class="box"><div class="k">${esc(t("vsToday"))} (${inr(today)})</div><div class="v ${chg>=0?"up":"down"}">${chg>=0?"▲":"▼"} ${Math.abs(chg).toFixed(0)}%</div></div>
    </div>
    <div class="predict">
      <div class="sub" style="margin:0 0 4px">${esc(t("predAt"))} · ${esc(S.market)} · ${esc(kName(hk))}</div>
      <div class="big">${inr(pred)} <small>${esc(t("perQ"))}</small></div>
      <div class="sub">${esc(t("likely"))}: <b>${inr(lo)} – ${inr(hi)}</b> · ≈ ${inr(pred/100)} ${esc(t("perKg"))}</div>
    </div>
    <p class="note">${esc(t("planWarn"))}</p>
    <details id="planMore"><summary>${esc(t("seeDetails"))}</summary>
    <div class="chartbox" style="height:220px;margin-top:14px"><canvas id="planChart" role="img"></canvas></div>
    <div class="legend"><span><i></i><span>${esc(t("actual"))}</span></span><span><i class="dash"></i><span>${esc(t("forecast"))}</span></span><span><i class="band"></i><span>${esc(t("band"))}</span></span></div>
    <p class="note">${esc(bt?t("accuracy",{h:Math.min(h,12),e:Math.round(bt.p50*100),e2:Math.round(bt.p80*100)}):t("accFew"))}</p>
    <table style="margin-top:8px"><thead><tr><th>${esc(t("holdTitle"))}</th><th class="num">₹/qtl</th></tr></thead><tbody>
      <tr class="sel"><td>${esc(kName(hk))}</td><td class="num">${inr(pred)}</td></tr>
      ${hold.map(x=>`<tr><td>${esc(kName(x.k))}</td><td class="num">${inr(x.v)} <span class="${x.v>=pred?"up":"down"}" style="font-size:.8rem">(${x.v>=pred?"+":""}${((x.v/pred-1)*100).toFixed(0)}%)</span></td></tr>`).join("")}
    </tbody></table>
    ${past.length?`<table style="margin-top:8px"><thead><tr><th>${esc(t("pastSame",{m:MONTHS[S.lang][hk%12]}))}</th><th class="num">₹/qtl</th></tr></thead><tbody>${past.map(k=>`<tr><td>${esc(kName(k))}</td><td class="num">${inr(mm.get(k))}</td></tr>`).join("")}</tbody></table>`:""}
    </details>`;
  $("#planMore").ontoggle=()=>{ if(S.charts.p) S.charts.p.resize(); };
  // chart: last 12 months actual + forecast path to harvest+2 with band
  const from=k0-11, to=hk+2, labels=[], act=[], fc=[], bl=[], bh=[];
  for(let k=from;k<=to;k++){
    labels.push(`${MONTHS_S[S.lang][k%12]} ${String(Math.floor(k/12)).slice(2)}`);
    act.push(k<=k0&&mm.has(k)?mm.get(k):null);
    if(k>=k0){const v=k===k0?mm.get(k0):fcast(mm,k);const hh=Math.max(1,k-k0);const bb=k===k0?0:e*Math.min(1,hh/h);fc.push(v);bl.push(v*(1-bb));bh.push(v*(1+bb))}
    else{fc.push(null);bl.push(null);bh.push(null)}
  }
  const c1=css("--series-1"),band=css("--series-1-soft"),grid=css("--grid"),ink=css("--text-2");
  const hiIdx=hk-from;
  S.charts.p=new Chart($("#planChart"),{type:"line",
    data:{labels,datasets:[
      {data:bh,borderWidth:0,pointRadius:0,fill:"+1",backgroundColor:band},
      {data:bl,borderWidth:0,pointRadius:0,fill:false},
      {label:t("actual"),data:act,borderColor:c1,borderWidth:2,pointRadius:0,pointHoverRadius:5,tension:.25,spanGaps:true},
      {label:t("forecast"),data:fc,borderColor:c1,borderWidth:2,borderDash:[6,5],tension:.25,
       pointRadius:fc.map((_,i)=>i===hiIdx?6:0),pointBackgroundColor:c1,pointBorderColor:css("--surface"),pointBorderWidth:2,pointHoverRadius:5}
    ]},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:{displayColors:false,filter:i=>i.datasetIndex>=2&&i.raw!=null,
        callbacks:{label:i=>`${i.dataset.label}: ${inr(i.raw)}`,afterBody:it=>{const k=it[0].dataIndex;return bl[k]!=null&&bl[k]!==bh[k]?`${t("likely")}: ${inr(bl[k])} – ${inr(bh[k])}`:""}}}},
      scales:{x:{grid:{display:false},ticks:{color:ink,maxTicksLimit:6,maxRotation:0}},
              y:{grid:{color:grid},border:{display:false},ticks:{color:ink,maxTicksLimit:4,callback:v=>"₹"+Number(v).toLocaleString("en-IN")}}}}});
  $("#planChart").setAttribute("aria-label",`${t("predAt")}: ${inr(pred)} (${inr(lo)} – ${inr(hi)})`);
}

function renderNearby(){
  const sel=S.markets.find(m=>m.market===S.market);
  const origin=S.user||(sel&&sel.geo);
  let rows=S.markets.map(m=>({...m,d:origin&&m.geo?km(origin,m.geo):null}));
  rows.sort((a,b)=>(a.d??1e9)-(b.d??1e9));
  const near=rows.filter(r=>r.market!==S.market).slice(0,7);
  if(sel) near.unshift({...sel,d:origin&&sel.geo?km(origin,sel.geo):null});
  $("#nearbyTable").innerHTML=`<table><thead><tr><th>${esc(t("mandi"))}</th><th class="num">${esc(t("dist"))}</th><th class="num">${esc(t("rate"))}</th><th class="num">${esc(t("date"))}</th></tr></thead><tbody>${
    near.map(r=>`<tr class="clickable ${r.market===S.market?"sel":""}" data-m="${esc(r.market)}"><td>${esc(r.market)}${r.market===S.market?`<span class="tag">${esc(t("you"))}</span>`:""}<div class="note" style="margin:0">${esc(r.district||"")}</div></td><td class="num nowrap">${r.d==null?"—":Math.round(r.d)+" "+esc(t("km"))}</td><td class="num">${inr(r.modal)}</td><td class="num nowrap">${esc(numDate(r.date))}</td></tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("#nearbyTable tr.clickable").forEach(tr=>tr.onclick=()=>selectMarket(tr.dataset.m));
}

/* ====== DEMO data (only with #demo in the URL; clearly labelled, not real prices) ====== */
const DEMO=(()=>{
  let rows=null;
  function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
  function build(){
    rows=[];
    const mk=[["Hubli (Amaragol)","Dharwad"],["Dharwar","Dharwad"],["Annigeri","Dharwad"],["Gadag","Gadag"],["Nargunda","Gadag"],["Haveri","Haveri"],["Ranebennur","Haveri"],["Belgaum","Belgaum"],["Bijapur","Bijapur"]];
    const cr=[["Onion",1800,0.35,9,["Local","Bellary"]],["Dry Chillies",16000,0.18,7,["Byadgi","Dabbi"]],["Cotton",7200,0.10,1,["Other"]],["Groundnut",6200,0.12,5,["Bold"]],
              ["Jowar(Sorghum)",3300,0.10,6,["White"]],["Bengal Gram(Gram)(Whole)",5600,0.09,8,["Bengal Gram"]],["Maize",2200,0.12,7,["Local"]],["Wheat",3100,0.08,10,["Bansi"]]];
    const end=Date.UTC(2026,10,18), start=end-4*365*DAY;
    mk.forEach(([m,dist],mi)=>cr.forEach(([c,base,amp,peak,vars],ci)=>{
      const r=rng(mi*97+ci*13+7); let walk=0; const mBias=1+(r()-.5)*0.08;
      if(mi>6 && ci>5) return;
      for(let d=start; d<=end; d+=DAY){
        const wd=new Date(d).getUTCDay(); if(wd===0) continue;
        walk+= (r()-.5)*0.02; walk*=0.995;
        if(r()<0.25) continue;
        const mo=new Date(d).getUTCMonth()+new Date(d).getUTCDate()/31;
        const yrs=(d-start)/(365*DAY);
        const season=1+amp*Math.cos((mo-peak)/12*2*Math.PI);
        vars.forEach((v,vi)=>{
          const modal=Math.round(base*mBias*season*(1+0.05*yrs)*(1+walk)*(1+vi*0.12)*(1+(r()-.5)*0.04)/5)*5;
          const x=new Date(d);
          rows.push({State:"Karnataka",District:dist,Market:m,Commodity:c,Variety:v,Grade:"FAQ",
            Arrival_Date:`${String(x.getUTCDate()).padStart(2,"0")}/${String(x.getUTCMonth()+1).padStart(2,"0")}/${x.getUTCFullYear()}`,
            Min_Price:String(Math.round(modal*0.85)),Max_Price:String(Math.round(modal*1.1)),Modal_Price:String(modal)});
        });
      }
    }));
    const pd=s=>{const [d,m,y]=s.split("/");return y+m+d};
    rows.sort((a,b)=>pd(a.Arrival_Date).localeCompare(pd(b.Arrival_Date)));  // real feed is appended day by day
  }
  const iso=s=>{const [d,m,y]=s.split("/");return `${y}-${m}-${d}`};
  return {
    meta(){ if(!rows) build(); const by={};
      for(const r of rows){const c=by[r.Commodity]??={commodity:r.Commodity,markets:{}};const m=c.markets[r.Market]??={market:r.Market,district:r.District,file:r.Commodity+"|"+r.Market,first:iso(r.Arrival_Date),rows:0,vals:{}};
        m.rows++; const d=iso(r.Arrival_Date); if(!m.last||d>m.last){m.last=d;m.vals=[]} if(d===m.last)m.vals.push(+r.Modal_Price);}
      return {updated:new Date().toISOString(),crops:Object.values(by).map(c=>({commodity:c.commodity,markets:Object.values(c.markets).map(m=>({...m,modal:median(m.vals)}))}))};
    },
    series(file){ if(!rows) build(); const [c,m]=file.split("|");
      return {rows:rows.filter(r=>r.Commodity===c&&r.Market===m).map(r=>[iso(r.Arrival_Date),r.Variety,+r.Min_Price,+r.Max_Price,+r.Modal_Price])}; }
  };
})();
